server:
  port: ${PORT:8087}
  shutdown: graceful

spring:
  application:
    name: trade-imports-stub
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/}
      database: ${MONGO_DATABASE:trade-imports-stub}
      auto-index-creation: true
      read-preference: ${MONGO_READ_PREFERENCE:secondary}
      write-concern: ${MONGO_WRITE_CONCERN:majority}
      connection-pool:
        min-size: ${MONGO_POOL_MIN_SIZE:10}
        max-size: ${MONGO_POOL_MAX_SIZE:100}
        max-wait-time-ms: ${MONGO_POOL_MAX_WAIT_TIME_MS:2000}
        max-connection-idle-time-ms: ${MONGO_POOL_MAX_IDLE_TIME_MS:60000}
      ssl:
        enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s


# CDP platform configuration
cdp:
  certificate: ${TRUSTSTORE_CDP_ROOT_CA:}
  metrics:
    enabled: true
  service-version: ${SERVICE_VERSION:0.0.0-local}
  tracing:
    header-name: ${TRACING_HEADER:x-cdp-request-id}
  cloudwatch:
    endpoint: ${AWS_EMF_AGENT_ENDPOINT:http://localhost:4566}
  proxyUrl: ${HTTP_PROXY:}

# AWS configuration
aws:
  region: ${AWS_REGION:eu-west-2}
  sts:
    token:
      audience: ${STS_TOKEN_AUDIENCE:urn:ipaffs:api:dev}
      expiration: ${STS_TOKEN_DURATION_SECONDS:3600}
  emf:
    enabled: ${AWS_EMF_ENABLED:true}
    environment: ${AWS_EMF_ENVIRONMENT:Local}
    namespace: ${AWS_EMF_NAMESPACE:trade-imports-stub}
    service:
      name: ${AWS_EMF_SERVICE_NAME:trade-imports-stub}
      type: ${AWS_EMF_SERVICE_TYPE:SpringBootApp}

# Logging configuration
logging:
  level:
    root: ${LOG_LEVEL:info}
    uk.gov.defra.trade.imports.animals: ${LOG_LEVEL:DEBUG}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}
    org.mongodb: ${LOGGING_LEVEL_ORG_MONGODB_DRIVER:WARN}
    io.netty.handler.logging.LoggingHandler: WARN

# Actuator endpoints
# Production: Only health endpoint exposed (secure by default)
# Development: Use dev profile (application-local.yml) for debugging endpoints
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,info,cache
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true
  health:
    mongo:
      enabled: false
  metrics:
    enabled: ${METRICS_ENABLED:true}
    enable:
      all: false
      controller: true
      jvm:
        memory:
          committed: true
          used: true
          max: true
        threads:
          live: true
          peak: true
      http:
        server:
          requests:
            active: true

# Application info (exposed via /info endpoint)
info:
  app:
    name: ${spring.application.name}
    version: ${cdp.service-version}
    environment: ${ENVIRONMENT:local}

# EUDPA-390 address lookup spike — the three federated-credential simulators (plan Step 6).
# sts-simulator.port is a dedicated port: the AWS SDK always POSTs GetWebIdentityToken to the
# root path of the endpoint override, so it can't share a sub-path on this app's main port.
sts-simulator:
  port: ${STS_SIMULATOR_PORT:8098}
  issuer: ${STS_SIMULATOR_ISSUER:http://host.docker.internal:8098/}
  subject: ${STS_SIMULATOR_SUBJECT:arn:aws:iam::000000000000:role/trade-imports-ins-backend}

address-lookup-simulator:
  # The audience ins-backend's Entra token request resolves to once /.default is stripped — must
  # match the local/stack "Scope" value in the EUDPA-390 plan exactly, api:// prefix included.
  # The real gateway policy in dev wants the api:// form and rejects the bare GUID, so this does
  # too: a simulator that accepted either would not have caught the 401 the spike hit.
  expected-audience: ${ADDRESS_LOOKUP_SIMULATOR_EXPECTED_AUDIENCE:api://33333333-3333-3333-3333-333333333333}

# Latency profiles (inc-007). Each integration answers with zero-delay (no added delay) or sla
# (a lognormal fitted to its targets). The interim targets are c-011's default until section 9.5
# of the volumetrics page agrees them.
stub-latency:
  integrations:
    trade-token:
      interface-name: Trade Platform OAuth token endpoint used before MDM calls
      owner: "Trade Platform (TBC: no §9.5 row)"
      service-level-source: "Interim (c-011 default): §9.5 has no row for this token endpoint"
      agreed: ${STUB_LATENCY_TRADE_TOKEN_AGREED:false}
      last-conformed: ${STUB_LATENCY_TRADE_TOKEN_LAST_CONFORMED:}
      profile: ${STUB_LATENCY_TRADE_TOKEN_PROFILE:${STUB_LATENCY_PROFILE:zero-delay}}
      paths:
        - /tenant/oauth2/v2.0/token
      sla:
        p50-ms: ${STUB_LATENCY_TRADE_TOKEN_P50_MS:100}
        p95-ms: ${STUB_LATENCY_TRADE_TOKEN_P95_MS:400}
        p99-ms: ${STUB_LATENCY_TRADE_TOKEN_P99_MS:1000}
    mdm:
      interface-name: "MDM reference data through APIM: countries and border control posts"
      owner: MDM / data platform team
      service-level-source: "Interim (c-011 default): §9.5 MDM through APIM latency is TBC"
      agreed: ${STUB_LATENCY_MDM_AGREED:false}
      last-conformed: ${STUB_LATENCY_MDM_LAST_CONFORMED:}
      profile: ${STUB_LATENCY_MDM_PROFILE:${STUB_LATENCY_PROFILE:zero-delay}}
      paths:
        - /mdm/geo/countries
        - /mdm/trade/bcp/poes
      sla:
        p50-ms: ${STUB_LATENCY_MDM_P50_MS:100}
        p95-ms: ${STUB_LATENCY_MDM_P95_MS:400}
        p99-ms: ${STUB_LATENCY_MDM_P99_MS:1000}
