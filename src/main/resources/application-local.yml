logging:
  level:
    root: DEBUG
    uk.gov.defra.trade.imports.animals: DEBUG
    org.mongodb.driver: ${LOGGING_LEVEL_ORG_MONGODB_DRIVER:WARN}
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.web: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: when-authorized
spring:
  data:
    mongodb:
      ssl:
        enabled: false
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: true
      trigger-file: .reloadtrigger

sts-simulator:
  issuer: ${STS_SIMULATOR_ISSUER:http://localhost:8098/}
